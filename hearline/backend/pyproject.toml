[project]
name = "hearline-backend"
version = "0.1.0"
description = "Hearline: personalized, news-based podcast generator (backend)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlmodel>=0.0.16",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "anthropic>=2.0",
    "numpy>=1.26",
    "pydub>=0.25",
    "audioop-lts>=0.2; python_version >= '3.13'",
    "mutagen>=1.47",
    "alembic>=1.16",  # database migrations (app/database/migrations/)
    "pyjwt[crypto]>=2.10",  # verifies Clerk login tokens
    "boto3>=1.34",  # Amazon Polly voices and S3 audio storage
]

[project.optional-dependencies]
openai = ["openai>=2.0"]
postgres = ["psycopg[binary]>=3.1"]  # DATABASE_URL=postgresql+psycopg://...
# Local embeddings: sentence-transformers needs PyTorch (no wheels for x86_64 macOS);
# fastembed runs the same MiniLM model on ONNX Runtime and is used as a fallback.
embeddings = ["sentence-transformers>=3.0"]
embeddings-onnx = ["fastembed>=0.4"]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "paracelsus>=0.15",  # data model diagram in app/database/README.md
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/database/migrations/versions/*.py" = ["E501"]  # generated by alembic --autogenerate

[tool.pyright]
venvPath = "."
venv = ".venv"

# Data model diagram: `python -m app.database.diagram` regenerates it from models.py
# Alembic CLI settings (`alembic revision --autogenerate` from hearline/backend/); the app uses migrate.py
[tool.alembic]
script_location = "app/database/migrations"
prepend_sys_path = ["."]

[tool.paracelsus]
base = "app.database.models:SQLModel"

