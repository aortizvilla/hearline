# Voices listeners can choose in Settings. The single place a voice is defined:
#   - shown in Settings (label, style, gender, accent, preview sample)
#   - mapped to a real voice per TTS provider (ElevenLabs voice id, Polly voice per language,
#     macOS `say` voice for free local testing)
# Loaded into the dim_voice table on startup (app/providers/voices.py), like seed_topics.yaml.
# `key` is what a profile stores: never rename one; set `active: false` to retire it.
# Remapping a provider voice is safe: clips are re-recorded with the new voice on next use.
# Every extra voice multiplies recordings per story, so keep the list short.
# `languages` gives each voice a native speaker per language, with its accent (Spain, Quebec,
# Brazil...). Those are ElevenLabs Voice Library voices: they must be added to the ElevenLabs
# account (`python -m app.cli check` lists any that aren't). Without one, the English voice
# speaks that language.
# Previews: python -m app.cli voice-previews (records `preview_text` once per voice and
# language; Settings plays the one for the language selected).

preview_text:
  en: Good morning. This is your Hearline briefing, with the stories that matter to you today.
  es: Buenos días. Este es tu resumen de Hearline, con las noticias que te importan hoy.
  fr: Bonjour. Voici votre briefing Hearline, avec les actualités qui comptent pour vous aujourd'hui.
  de: Guten Morgen. Hier ist dein Hearline-Briefing mit den Nachrichten, die heute für dich zählen.
  it: Buongiorno. Ecco il tuo briefing Hearline, con le notizie che contano per te oggi.
  pt: Bom dia. Este é o seu resumo Hearline, com as notícias que importam para você hoje.

