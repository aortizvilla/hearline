# Suggested subcategories per topic, shown in Settings as one-tap chips under each topic
# (listeners can still type their own; step 1 classifies those). Loaded into dim_subtopic on
# startup (seed_subtopics in app/pipeline/step1_topics.py), marked `suggested`.
# Keyed by pipeline topic key (config/seed_topics.yaml), not the Settings slug.
# keywords: lowercase terms that tag a story as this subcategory (whole-word match on headline
# and summary). Avoid generic words ("deal", "season", "release"): they tag the wrong stories.
# labels: the name in each other interface language (English is `label`).
# A key already created by a listener (e.g. cannes-film-festival) is merged, not duplicated.

