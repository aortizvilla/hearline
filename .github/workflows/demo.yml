# Static demo on Cloudflare Pages (free; works from a private repo): the frontend built with
# VITE_STATIC_DEMO=1, reading the demo snapshot in hearline/frontend/demo-data/ (made by
# `python -m app.cli export-demo`). No server, no database, no app keys.
#
# One-time setup (see solution.md, "Try the demo"):
#   repo Settings > Secrets and variables > Actions
#     secrets:   CLOUDFLARE_API_TOKEN  (Cloudflare token with "Cloudflare Pages: Edit")
#                CLOUDFLARE_ACCOUNT_ID
#     variable:  CLOUDFLARE_PROJECT    (e.g. hearline-demo-7f3k: the site is <name>.pages.dev)
# Until the variable is set this workflow skips, so pushes never fail.
name: Demo site

on:
  push:
    branches: [main]
    paths: ["hearline/frontend/**", ".github/workflows/demo.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-site
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ vars.CLOUDFLARE_PROJECT != '' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hearline/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hearline/frontend/package-lock.json
      - run: npm ci
      - name: Build the static demo
        env:
          VITE_STATIC_DEMO: "1"
        run: npm run build
      # first run only: create the Pages project (fails harmlessly once it exists)
      - name: Create the Cloudflare Pages project
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create ${{ vars.CLOUDFLARE_PROJECT }} --production-branch=main
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy hearline/frontend/dist --project-name=${{ vars.CLOUDFLARE_PROJECT }} --branch=main
